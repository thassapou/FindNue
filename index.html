<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F8FD">
<title>FindNue Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* FindNue prototype. Layout concept: a phone-sized app (full screen on mobile, framed on desktop)
   with pages that slide, bottom sheets for decisions, and toasts for feedback. Single light theme by design. */
:root{
  --ink:#123A6E;--blue:#2A6DB5;--blue-d:#1B4F94;--bg:#F4F8FD;--card:#FFFFFF;--line:#D5E3F3;--line2:#E3EDF8;
  --mut:#4F6584;--sky:#E3EEFA;--gold:#C79B4A;--gold-l:#E8CF9B;--goldt:#8A6420;--ok:#1E8A5A;--err:#C0392B;--navy:#0A1F3F;
  --ease:cubic-bezier(.22,1,.36,1);--sh:0 14px 30px -20px rgba(18,58,110,.5);
  --sans:'Google Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Cormorant Garamond',Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:14px/1.45 var(--sans);color:var(--ink);background:#DCE8F6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sf{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mut{color:var(--mut)}.gold{color:var(--gold)}
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:72px;background:radial-gradient(circle at 82% 8%,#BCDBF7,transparent 46%),radial-gradient(circle at 6% 100%,#F2E6CC,transparent 40%),linear-gradient(160deg,#F8FBFF,#DCE8F6)}
.device{position:relative;width:100%;max-width:430px;height:100%;flex:none;background:var(--bg)}
.rail{display:none}
@media (min-width:540px){.device{width:402px;height:min(880px,calc(100% - 40px));border-radius:46px;overflow:hidden;box-shadow:0 0 0 9px #0d1015,0 0 0 10px #4a5058,0 50px 90px -40px rgba(10,31,63,.6)}}
@media (min-width:980px){.rail{display:block;width:260px}.rail .rl{height:40px;width:auto;margin-bottom:28px}.rail h2{font:700 34px/1.05 var(--serif);margin-bottom:8px}.rail p{color:var(--mut);margin-bottom:20px}
  .rail nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rail nav button{height:40px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--blue-d);transition:background .2s,transform .2s var(--ease)}
  .rail nav button:hover{background:#fff}.rail nav button:active{transform:scale(.96)}.rail .rst{margin-top:16px;font-size:12.5px;font-weight:700;color:var(--mut);text-decoration:underline;text-underline-offset:3px}}
#app{position:absolute;inset:0;overflow:hidden;isolation:isolate}
#screens{position:absolute;inset:0}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .46s var(--ease),opacity .4s var(--ease);will-change:transform}
.scr.in-r,.scr.out-r{transform:translateX(100%)}
.scr.under{transform:translateX(-24%);opacity:.5}
.scr.hide{display:none}
.scr.fade0{opacity:0}.scr.up0{opacity:0;transform:translateY(30px)}
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;position:relative}
.body::-webkit-scrollbar{display:none}
.pad{padding:0 24px}
.hd{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 8px;gap:12px;flex:none}
.hd h1{font:700 26px/1.1 var(--serif);letter-spacing:-.01em;text-align:center;flex:1}
.sp{width:44px;flex:none}
.ic{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #DCE8F6;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;box-shadow:0 8px 18px -12px rgba(18,58,110,.5);transition:transform .25s var(--ease)}
.ic:active,.press:active,.btn:active{transform:scale(.97)}
.press{transition:transform .25s var(--ease)}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;height:56px;width:100%;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;font-size:15px;text-align:center;box-shadow:0 14px 26px -14px rgba(18,58,110,.8);transition:transform .25s var(--ease),opacity .3s,background .3s}
.btn.ghost{background:#fff;color:var(--blue-d);box-shadow:inset 0 0 0 1px #CFE0F3}
.btn.light{background:#fff;color:var(--ink);box-shadow:0 18px 34px -16px rgba(0,0,0,.6)}
.btn.danger{background:var(--err);box-shadow:0 14px 26px -14px rgba(192,57,43,.7)}
.btn.dghost{background:#fff;color:var(--err);box-shadow:inset 0 0 0 1px #EBC9C5}
.btn.off{opacity:.45;box-shadow:none}
.btn.load{pointer-events:none}.btn.load>*{opacity:0}
.btn.load::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite}
.btn.ghost.load::after{border-color:rgba(42,109,181,.3);border-top-color:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{display:block}.lbl{display:block;font-size:12px;font-weight:700;color:#3A5679;margin-bottom:8px}
.in{display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;border-radius:18px;background:#fff;border:1px solid var(--line);transition:border-color .25s,box-shadow .25s}
.in:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(42,109,181,.14)}
.in.bad{border-color:var(--err);box-shadow:0 0 0 4px rgba(192,57,43,.1)}
.in input,.in textarea{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px;color:var(--ink);padding:0}
.in input::placeholder,.in textarea::placeholder{color:#6B7F9B}
.in .pre{font-weight:700;color:var(--mut);padding-right:12px;border-right:1px solid var(--line)}
.in .eye{display:flex;color:var(--mut)}
.in.ta{height:auto;align-items:flex-start;padding:14px 18px 26px;position:relative}.in.ta textarea{resize:none;height:64px;line-height:1.5}
.in.ta .cn{position:absolute;right:14px;bottom:8px;font-size:11.5px;color:var(--mut)}
.err{max-height:0;opacity:0;overflow:hidden;font-size:12px;color:var(--err);padding:0 4px;transition:max-height .3s var(--ease),opacity .3s,margin .3s}
.err.show{max-height:40px;opacity:1;margin-top:6px}
.shake{animation:shake .42s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--blue-d);white-space:nowrap;flex:none;transition:background .3s,color .3s,border-color .3s,transform .25s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .i{width:16px;height:16px}
.scrollx{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 20px 6px;scroll-snap-type:x proximity}
.scrollx::-webkit-scrollbar{display:none}
.card{background:#fff;border:1px solid var(--line2);border-radius:22px;box-shadow:var(--sh)}
.rv{animation:rv .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rv{from{opacity:0;transform:translateY(14px)}}
.sk{background:linear-gradient(90deg,#E6EEF8 25%,#F3F7FC 50%,#E6EEF8 75%);background-size:200% 100%;animation:shim 1.2s linear infinite;border-radius:14px}
@keyframes shim{to{background-position:-200% 0}}
.eyebrow{font-size:13px;font-weight:600;color:var(--gold-l)}.eyebrow.gt{color:var(--goldt)}
/* tab bar */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:80px;background:#fff;border-radius:28px 28px 0 0;box-shadow:0 -14px 34px -22px rgba(18,58,110,.55);display:flex;padding:0 8px;transform:translateY(110%);transition:transform .45s var(--ease);z-index:20}
#tabbar.show{transform:none}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:14px;font-size:11px;font-weight:600;color:var(--mut);transition:color .25s}
.tab .i{transition:transform .35s var(--ease)}
.tab.on{color:var(--blue);font-weight:700}.tab.on .i{transform:translateY(-2px) scale(1.08)}
#tabInd{position:absolute;top:0;left:0;width:22px;height:3px;border-radius:2px;background:var(--gold);transition:transform .45s var(--ease)}
.bdg{position:absolute;top:9px;left:calc(50% + 7px);min-width:16px;height:16px;border-radius:8px;background:var(--err);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;animation:pop .5s var(--ease)}
/* splash + onboarding + login */
.splash{position:absolute;inset:0;background:var(--navy);color:#fff;overflow:hidden}
.splash>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 9s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,31,63,.5),rgba(10,31,63,.55) 40%,rgba(10,31,63,.95))}
.splash .mid{position:absolute;left:0;right:0;top:36%;text-align:center}
.splash .mid img{width:270px;margin:0 auto;animation:rv 1s var(--ease) .2s both}
.splash .mid .ln{display:block;width:44px;height:1px;background:var(--gold-l);margin:22px auto 14px;animation:rv 1s var(--ease) .45s both}
.splash .mid p{color:var(--gold-l);font-weight:500;font-size:14px;animation:rv 1s var(--ease) .6s both}
.splash .bot{position:absolute;left:28px;right:28px;bottom:46px;text-align:center;animation:rv 1s var(--ease) .8s both}
.splash .bot p{font-size:16px;line-height:1.55;color:#DCEBFA;margin-bottom:24px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:width .4s var(--ease),background .3s}
.dots i.on{width:26px;background:var(--gold-l)}
.ob{position:absolute;inset:0;background:var(--bg)}
.obtrack{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.obtrack::-webkit-scrollbar{display:none}
.obs{position:relative;flex:0 0 100%;scroll-snap-align:start;height:100%}
.obs>img{position:absolute;left:0;top:0;width:100%;height:56%;object-fit:cover}
.obs .obsh{position:absolute;left:0;top:0;right:0;height:56%;background:linear-gradient(180deg,rgba(10,31,63,.6),rgba(10,31,63,0) 50%)}
.obc{position:absolute;left:0;right:0;top:46%;bottom:0;background:var(--bg);border-radius:36px 36px 0 0;box-shadow:0 -20px 40px -24px rgba(10,31,63,.5);padding:32px 28px 0}
.obc h1{font:700 40px/1.02 var(--serif);margin-top:10px}.obc>p.mut{margin-top:14px;font-size:14.5px;line-height:1.55}
.usp{display:flex;gap:8px;margin-top:22px}.usp div{flex:1;text-align:center;font-size:11.5px;font-weight:600;line-height:1.35}
.usp span{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid #DCE8F6;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;color:var(--blue);box-shadow:0 10px 20px -14px rgba(18,58,110,.5)}
.obtop{position:absolute;left:24px;right:24px;top:24px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}.obtop>*{pointer-events:auto}
.obtop img{height:30px;width:auto}
.obbot{position:absolute;left:28px;right:28px;bottom:36px}.obbot .dots i{background:#C5D7EC}.obbot .dots i.on{background:var(--gold)}
.glass{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.32);color:#fff;font-size:13px;font-weight:600;backdrop-filter:blur(8px);position:relative}
.glass.round{width:40px;padding:0;justify-content:center}
.dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--gold-l)}
.lhero{position:relative;height:262px;flex:none;color:#fff;overflow:hidden}
.lhero>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%}
.lhero .shade{background:linear-gradient(180deg,rgba(10,31,63,.55),rgba(10,31,63,.88))}
.lsheet{flex:1;min-height:0;margin-top:-26px;background:var(--bg);border-radius:32px 32px 0 0;position:relative;display:flex;flex-direction:column}
.divl{display:flex;align-items:center;gap:12px;margin:24px 0 18px;font-size:12.5px;color:var(--mut)}.divl::before,.divl::after{content:"";flex:1;height:1px;background:var(--line)}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.btn.soc{height:52px;font-size:14px;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px #CFE0F3}
/* home */
.hero{position:relative;height:316px;overflow:hidden;color:#fff}
.hero>img{position:absolute;left:0;top:-20px;width:100%;height:calc(100% + 40px);object-fit:cover;object-position:center 55%;will-change:transform}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,31,63,.62),rgba(10,31,63,.48) 40%,rgba(10,31,63,.9))}
.htop{position:absolute;left:20px;right:20px;top:22px;display:flex;align-items:center;justify-content:space-between}
.hcopy{position:absolute;left:24px;top:92px;width:330px}.hcopy h1{font:700 35px/1.02 var(--serif);margin-top:8px}
.sbar{display:flex;align-items:center;gap:12px;height:62px;margin:-50px 20px 0;padding:0 9px 0 18px;border-radius:22px;position:relative;z-index:2;box-shadow:0 22px 36px -20px rgba(10,31,63,.7)}
.sfake{flex:1;display:flex;align-items:center;gap:12px;color:#6B7F9B;font-size:14.5px;height:100%;min-width:0}.sfake span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;position:relative;transition:transform .25s var(--ease)}
.fbtn:active{transform:scale(.92)}
.fbtn b{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#fff;font-size:10.5px;line-height:18px;text-align:center;padding:0 4px;border:2px solid #fff}
.cats{display:flex;padding:22px 20px 0}
.cat{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11.5px;font-weight:600}
.cat span{width:58px;height:58px;border-radius:50%;background:#fff;border:1px solid #DCE8F6;display:flex;align-items:center;justify-content:center;color:var(--blue);box-shadow:0 12px 22px -16px rgba(18,58,110,.55);transition:transform .3s var(--ease)}
.cat:active span{transform:scale(.9)}
.sech{display:flex;justify-content:space-between;align-items:baseline;padding:26px 20px 12px}
.sech h2{font:700 28px/1 var(--serif)}.sech button{font-size:13px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:4px}
.vt{position:relative;width:176px;flex:none;padding:8px;scroll-snap-align:start}
.ph{position:relative;overflow:hidden;background:var(--sky);border-radius:16px}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .7s var(--ease)}
.card:hover .ph img{transform:scale(1.05)}
.vt .ph{height:124px}
.vt h3,.vl h3{font-size:14.5px;font-weight:700;line-height:1.25}
.vt .tx{padding:10px 4px 2px}.meta{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mut);margin-top:3px}.meta .i{width:13px;height:13px}.meta .sep{width:3px;height:3px;border-radius:50%;background:var(--gold)}
.pr{margin-top:8px;padding-top:8px;border-top:1px solid #E6EEF8;font-size:13.5px;font-weight:700}.pr small{font-size:11px;font-weight:500;color:var(--mut)}
.stretch{position:absolute;inset:0;border-radius:inherit;z-index:1}
.hb{position:absolute;z-index:2;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .25s var(--ease)}
.hb:active{transform:scale(.88)}.hb .i{width:17px;height:17px;transition:fill .25s,color .25s}
.hb.on{color:#D2455B}.hb.on .i{fill:#D2455B}.hb.pop .i{animation:pop .55s var(--ease)}
@keyframes pop{30%{transform:scale(1.45)}60%{transform:scale(.88)}}
.vl{position:relative;display:flex;gap:12px;padding:10px;margin:0 20px 12px}
.vl .ph{width:100px;height:116px;flex:none}.vl h3{padding-right:40px}.vl .pr2{margin-top:8px;font-size:11px;color:var(--mut)}.vl .pr2 b{display:block;color:var(--ink);font-size:15px}
.vb{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;color:var(--goldt);background:#FBF3E2;border-radius:999px;padding:2px 8px;margin-left:4px}.vb .i{width:11px;height:11px}
.promo{margin:26px 20px 0;padding:18px 18px 18px 20px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#fff,#F7F1E4);border-color:#EADCB9;position:relative;overflow:hidden}
.promo h3{font:700 24px/1.05 var(--serif);margin:4px 0}.promo p{font-size:12.5px;color:var(--mut)}
.promo .code{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 12px;border-radius:14px;border:1.5px dashed var(--gold);font-size:12px;font-weight:700;color:var(--goldt);background:rgba(255,255,255,.7);transition:transform .25s var(--ease)}
.promo .code:active{transform:scale(.94)}
.empty{text-align:center;padding:40px 36px}.empty svg.art{width:120px;height:120px;margin:0 auto 14px}.empty h3{font:700 26px/1.1 var(--serif);margin-bottom:6px}.empty p{color:var(--mut);font-size:13.5px;margin-bottom:20px}
.empty .btn{width:auto;display:inline-flex;padding:0 28px;height:48px}
/* explore */
.srch{margin:6px 20px 0}.srch .in{height:54px;border-radius:999px;padding:0 8px 0 18px}
.srch .clr{width:34px;height:34px;border-radius:50%;background:var(--sky);color:var(--blue-d);display:none;align-items:center;justify-content:center;flex:none}.srch .clr.show{display:flex}
.sugg{overflow:hidden;max-height:0;transition:max-height .45s var(--ease)}.sugg.open{max-height:260px}
.sugg>div{padding:16px 24px 4px}.sugg h4{margin:0 0 10px;font-size:12px;color:var(--mut);font-weight:700;display:flex;justify-content:space-between}.sugg h4 button{color:var(--blue);font-weight:700}
.sugg .rec{display:flex;align-items:center;gap:10px;height:38px;width:100%;color:var(--ink);font-size:14px}.sugg .rec .i{color:var(--mut);width:18px;height:18px}
.tool{display:flex;align-items:center;gap:10px;padding:12px 20px 4px}.tool .cnt{flex:1;font-size:13px;color:var(--mut)}.tool .cnt b{color:var(--ink)}
.tb{display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--blue-d);position:relative;transition:transform .25s var(--ease)}.tb:active{transform:scale(.95)}
.tb .i{width:18px;height:18px}.tb b{min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:#fff;font-size:10.5px;line-height:18px;text-align:center;padding:0 4px}
/* sheets, toasts */
#sheets{position:absolute;inset:0;pointer-events:none;z-index:60}
.sheet-wrap{position:absolute;inset:0;pointer-events:none}
.sheet-wrap .bd{position:absolute;inset:0;background:rgba(10,31,63,.46);opacity:0;transition:opacity .4s;backdrop-filter:blur(2px)}
.sheet-wrap.open{pointer-events:auto}.sheet-wrap.open .bd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;display:flex;flex-direction:column;background:#fff;border-radius:30px 30px 0 0;box-shadow:0 -20px 50px -20px rgba(10,31,63,.5);transform:translateY(105%);transition:transform .52s var(--ease);outline:0}
.sheet-wrap.open .sheet{transform:none}.sheet.drag{transition:none}
.grab{flex:none;padding:10px 0 6px;cursor:grab;touch-action:none}.grab i{display:block;width:40px;height:4px;border-radius:2px;background:#CBD9EA;margin:0 auto}
.sh-h{padding:6px 24px 10px;touch-action:none}.sh-h h2{font:700 28px/1.1 var(--serif)}.sh-h p{margin-top:4px;color:var(--mut);font-size:13.5px}
.sh-b{overflow-y:auto;padding:6px 24px 12px;scrollbar-width:none;min-height:0}.sh-b::-webkit-scrollbar{display:none}

.mi .mic{width:38px;height:38px;border-radius:12px;background:var(--sky);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}.mi span.t{flex:1;font-weight:600}.mi .i.ch{color:var(--mut);width:18px}
.faq button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;font-weight:700;border-top:1px solid var(--line2)}.faq button:first-child{border-top:0}.faq .i{transition:transform .35s var(--ease);color:var(--mut)}.faq button[aria-expanded=true] .i{transform:rotate(180deg)}
.faq .ans{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}.faq .ans.open{grid-template-rows:1fr}.faq .ans>p{overflow:hidden;color:var(--mut);font-size:13.5px;line-height:1.55}.faq .ans.open>p{padding-bottom:12px}
.segw{margin:10px 20px 14px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

  <h1 class="sf" style="font-size:38px;line-height:1;margin-top:10px">${esc(v.name)}</h1>
  <div style="display:flex;align-items:center;gap:14px;margin-top:8px;font-size:13px;flex-wrap:wrap"><span class="mut" style="display:flex;align-items:center;gap:4px">${ic('pin','').replace('class="i ','class="i gold ')}${esc(v.area)}</span><span style="display:flex;align-items:center;gap:4px">${ic('star','gold')}<b>${v.rating}</b><span class="mut">(${v.reviews} ulasan)</span></span></div>

  <h2 class="h2s">Tanggal tersedia</h2><div class="qd">${free.map(k=>{const d=pk(k);return`<button type="button" data-act="quickdate" data-d="${k}"><span>${DAYS[d.getDay()].slice(0,3)}</span><b>${d.getDate()}</b><span>${MONTHS[d.getMonth()].slice(0,3)}</span></button>`}).join('')}</div>

  mount(el){const gt=$('#gt',el),ds=$$('#gd i',el),gc=$('#gc',el);let cur=0;gt.addEventListener('scroll',()=>{const i=Math.round(gt.scrollLeft/gt.clientWidth);if(i!==cur){cur=i;ds.forEach((d,k)=>d.classList.toggle('on',k===i));gc.textContent=`${i+1} / ${ds.length} foto`}});

Screens.date=()=>{const d=S.draft,v=V(d.vid);let month=d.date?pk(d.date):addDays(TODAY,9);month=new Date(month.getFullYear(),month.getMonth(),1);const minD=addDays(TODAY,3);let anim=false;
  return{html:`${hdr('Pilih Tanggal &amp; Waktu')}<div class="body">${steps(0)}<div class="card vmini"><img src="assets/${v.ph[0]}" alt=""><div><b>${esc(v.name)}</b><span>${esc(v.area)}</span></div></div>
  <div class="card cal" id="cal"></div><div class="legend"><span><i style="width:12px;height:12px;border-radius:50%;border:1.5px solid var(--blue)"></i>Tersedia</span><span><i style="width:12px;height:12px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 1.5px var(--gold)"></i>Dipilih</span><span><i style="width:14px;height:2px;background:#9DB0C8"></i>Penuh</span></div>
  <div class="pad"><h2 class="h2s" id="st" style="margin-top:22px">Pilih Waktu Mulai</h2><div class="slots" id="slots"></div><h3 class="sec-t" style="margin-top:20px">Durasi sewa</h3><div class="seg" id="seg"><i class="thumb"></i>${[3,4,6].map(n=>`<button data-dur="${n}" type="button">${n} jam</button>`).join('')}</div><p class="note" id="dn"></p></div><div style="height:30px"></div></div>
  <div class="dock" id="dk"><div class="dinf" id="di" style="flex:1;min-width:0"></div><button class="btn" id="nx" type="button" style="width:150px">Lanjutkan</button></div>`,
  mount(el){const cal=$('#cal',el),slots=$('#slots',el),seg=$('#seg',el),di=$('#di',el),nx=$('#nx',el);
    const maxDur=t=>t?Math.min(6,24-parseInt(t)):6;
    function drawCal(){const y=month.getFullYear(),m=month.getMonth();const first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;let av=0,cells='';
      for(let i=0;i<off;i++)cells+='<span></span>';
      for(let n=1;n<=days;n++){const dt=new Date(y,m,n),k=key(dt);const past=dt<minD,full=!past&&isFull(v.id,k);if(!past&&!full)av++;const on=d.date===k;const cls=['d',on?'on':'',full?'f':'',key(dt)===key(TODAY)?'td':''].join(' ');
        cells+=`<button type="button" class="${cls}" data-k="${k}" ${past||full?'disabled':''} ${on?'aria-pressed="true"':''} aria-label="${n} ${MONTHS[m]}${full?', penuh':''}">${n}</button>`}
      const prevOk=new Date(y,m,1)>new Date(minD.getFullYear(),minD.getMonth(),1);
      cal.innerHTML=`<div class="calh"><button type="button" data-m="-1" ${prevOk?'':'disabled'} aria-label="Bulan sebelumnya">${ic('left')}</button><h2>${MONTHS[m]} ${y}</h2><button type="button" data-m="1" aria-label="Bulan berikutnya">${ic('right')}</button></div><div class="g7 ${anim?'calx':''}">${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(w=>`<span class="wk">${w}</span>`).join('')}${cells}</div>`;anim=true}
    function drawSlots(){slots.innerHTML=TIMES.map(t=>{const full=d.date&&slotFull(v.id,d.date,t);return`<button type="button" class="sl ${d.time===t?'on':''} ${full?'f':''}" data-t="${t}" ${!d.date||full?'disabled':''}>${t}</button>`}).join('');
      const md=maxDur(d.time);$$('button',seg).forEach(b=>{b.disabled=+b.dataset.dur>md;b.classList.toggle('on',+b.dataset.dur===d.dur)});
      const ix=[3,4,6].indexOf(d.dur),bs=$$('button',seg),th=$('.thumb',seg);th.style.width=bs[0].offsetWidth+'px';th.style.transform=`translateX(${bs[0].offsetWidth*ix}px)`;
      $('#dn',el).innerHTML=d.date?`${ic('clock')}Sesi ${d.time||'…'} – ${d.time?endT(d.time,d.dur):'…'} (${d.dur} jam)`:`${ic('info')}Pilih tanggal terlebih dahulu untuk melihat jam yang tersedia.`}
    function drawDock(){const ok=d.date&&d.time;di.innerHTML=ok?`<b>${shortDate(d.date)}</b><span>${d.time} – ${endT(d.time,d.dur)} · ${d.dur} jam</span>`:`<b>Belum dipilih</b><span>Pilih tanggal dan jam mulai</span>`;nx.classList.toggle('off',!ok)}
    const all=()=>{drawCal();drawSlots();drawDock()};all();raf(drawSlots);
    cal.addEventListener('click',e=>{const m=e.target.closest('[data-m]');if(m){month=new Date(month.getFullYear(),month.getMonth()+ +m.dataset.m,1);drawCal();return}
      const b=e.target.closest('[data-k]');if(!b||b.disabled)return;const first=!d.date;d.date=b.dataset.k;if(d.time&&slotFull(v.id,d.date,d.time))d.time=null;all();vib();if(first)setTimeout(()=>$('#st',el).scrollIntoView({behavior:'smooth',block:'start'}),120)});
    slots.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b||b.disabled)return;d.time=b.dataset.t;const md=maxDur(d.time);if(d.dur>md){d.dur=md>=4?4:3;toast(`Durasi disesuaikan menjadi ${d.dur} jam agar selesai sebelum tengah malam`,{type:'info'})}drawSlots();drawDock();vib()});
    seg.addEventListener('click',e=>{const b=e.target.closest('[data-dur]');if(!b||b.disabled)return;d.dur=+b.dataset.dur;drawSlots();drawDock()});
    nx.addEventListener('click',()=>{if(nx.classList.contains('off')){const k=$('#dk',el);k.classList.remove('shake');void k.offsetWidth;k.classList.add('shake');toast(d.date?'Pilih jam mulai acara dulu':'Pilih tanggal dan jam mulai dulu',{type:'error'});return}nav.push('form')})}}};

Screens.form=()=>{const d=S.draft,v=V(d.vid);
  return{html:`${hdr('Data Pemesan')}<div class="body">${steps(1)}<div class="card vmini"><img src="assets/${v.ph[0]}" alt=""><div><b>${esc(v.name)}</b><span>${shortDate(d.date)} · ${d.time} – ${endT(d.time,d.dur)}</span></div></div>
  <div class="pad" style="padding-top:18px;padding-bottom:24px;display:grid;gap:14px">
  ${fld('f-name','Nama lengkap',{value:d.name,auto:'name'})}${fld('f-phone','No. HP',{pre:'+62',value:d.phone,mode:'tel',auto:'tel'})}${fld('f-email','Email',{value:d.email,type:'email',auto:'email'})}
  <div class="fl"><span class="lbl">Tipe acara</span><div class="chips" id="fev">${v.ev.map(e=>`<button class="chip ${d.ev===e?'on':''}" data-act="setev" data-v="${e}" type="button">${ic(EV[e][1])}${EV[e][0]}</button>`).join('')}</div></div>
  <div class="fl"><label class="lbl" for="f-guests">Jumlah tamu <span class="mut" style="font-weight:500">(maks. ${v.cap})</span></label><div class="stepper"><button type="button" data-g="-10" aria-label="Kurangi tamu">${ic('minus')}</button><div class="in" id="w-f-guests"><input id="f-guests" type="text" inputmode="numeric" value="${d.guests}"><span class="mut" style="font-size:13px">orang</span></div><button type="button" data-g="10" aria-label="Tambah tamu">${ic('plus')}</button></div><p class="err" id="e-f-guests" role="alert"></p></div>
  <div class="fl"><span class="lbl">Paket</span><div class="pk" id="pk" role="radiogroup" aria-label="Paket" style="display:grid;gap:10px">${Object.keys(PKG).map(k=>`<div class="opt ${d.pkg===k?'on':''}" data-pkg="${k}"><input type="radio" name="pkg" id="pk-${k}" ${d.pkg===k?'checked':''}><label class="opr" for="pk-${k}"><span class="rd"></span><span style="flex:1"><b>${PKG[k].n}</b><span class="d2">${PKG[k].d}</span></span><span class="add">${PKG[k].add?'+'+rp(PKG[k].add):'Termasuk'}</span></label></div>`).join('')}</div></div>
  <div class="fl"><label class="lbl" for="f-notes">Catatan (opsional)</label><div class="in ta" id="w-f-notes"><textarea id="f-notes" maxlength="200" placeholder="Contoh: butuh panggung dan kursi tambahan">${esc(d.notes)}</textarea><span class="cn" id="cn">${d.notes.length}/200</span></div></div></div></div>
  <div class="dock"><button class="btn" id="fnx" type="button">Lanjutkan</button></div>`,
  mount(el){const g=$('#f-guests',el),cn=$('#cn',el),notes=$('#f-notes',el);
    const vg=()=>{const n=+g.value.replace(/\D/g,'');return!n||n<1?'Isi jumlah tamu':n>v.cap?`Melebihi kapasitas venue (${v.cap} orang)`:''};
    g.addEventListener('input',()=>{g.value=g.value.replace(/\D/g,'').slice(0,4);setErr(el,'f-guests',vg())});
    $$('[data-g]',el).forEach(b=>b.addEventListener('click',()=>{let n=(+g.value||0)+ +b.dataset.g;n=Math.max(10,Math.min(v.cap,n));g.value=n;setErr(el,'f-guests','');vib()}));
    notes.addEventListener('input',()=>cn.textContent=notes.value.length+'/200');
    $('#f-phone',el).addEventListener('input',e=>{let x=e.target.value.replace(/[^\d]/g,'').replace(/^0/,'').slice(0,12);e.target.value=x.replace(/(\d{3})(?=\d)/g,'$1 ').trim()});
    $('#pk',el).addEventListener('click',e=>{const o=e.target.closest('[data-pkg]');if(!o)return;d.pkg=o.dataset.pkg;$$('.opt',el).forEach(x=>{const on=x===o;x.classList.toggle('on',on);$('input',x).checked=on})});
    $('#fnx',el).addEventListener('click',()=>{const n=$('#f-name',el).value.trim(),ph=$('#f-phone',el).value,em=$('#f-email',el).value;const E={'f-name':n.length<3?'Nama minimal 3 huruf':'','f-phone':vPhone(ph),'f-email':vEmail(em),'f-guests':vg()};
      Object.keys(E).forEach(k=>setErr(el,k,E[k]));const bad=Object.keys(E).find(k=>E[k]);if(bad){$('#'+bad,el).focus();toast('Lengkapi data yang ditandai merah',{type:'error'});return}
      d.name=n;d.phone=ph;d.email=em.trim();d.guests=+g.value;d.notes=notes.value.trim();nav.push('summary')})}}};

Screens.summary=()=>{const d=S.draft,v=V(d.vid);
  return{html:`${hdr('Ringkasan Booking')}<div class="body">${steps(2)}<div class="pad" style="padding-top:16px;padding-bottom:24px;display:grid;gap:12px">
  <div class="card" style="display:flex;gap:14px;padding:10px;align-items:center"><img src="assets/${v.ph[0]}" alt="" style="width:84px;height:84px;border-radius:14px;object-fit:cover;flex:none"><div><h2 class="sf" style="font-size:24px;line-height:1.05">${esc(v.name)}</h2><p class="mut" style="font-size:12.5px;margin-top:2px">${esc(v.area)}</p><p style="font-size:12.5px;display:flex;align-items:center;gap:4px;margin-top:2px">${ic('star','gold')}<b>${v.rating}</b><span class="mut">(${v.reviews})</span></p></div></div>
  <div class="card sumc" id="det"></div>
  <div class="card sumc" id="prc"></div>
  <div id="pcw"></div>
  <label class="cb" id="agw"><input type="checkbox" id="ag" ${d.agree?'checked':''}><span class="bx">${ic('check')}</span><span>Saya menyetujui <b>Syarat &amp; Ketentuan</b>. Pembatalan gratis hingga 7 hari sebelum acara; setelahnya dana kembali 50%.</span></label></div></div>
  <div class="dock"><button class="btn" id="snx" type="button">Lanjutkan ke Pembayaran</button></div>`,
  mount(el){const det=$('#det',el),prc=$('#prc',el),pcw=$('#pcw',el);
    const row=(a,b,ed)=>`<div class="rw"><span>${a}</span><b>${b}${ed?`<button class="ed" data-act="edit" data-to="${ed}" type="button">Ubah</button>`:''}</b></div>`;
    det.innerHTML=row('Tanggal',fmtDate(d.date),'date')+row('Waktu',`${d.time} – ${endT(d.time,d.dur)} (${d.dur} jam)`,'date')+row('Tipe acara',EV[d.ev][0],'form')+row('Jumlah tamu',d.guests+' orang','form')+row('Paket',PKG[d.pkg].n,'form')+row('Pemesan',esc(d.name),'form');
    function drawP(first){const p=priceOf(d);
      prc.innerHTML=`<div class="rw"><span>Sewa venue (${d.dur} jam)</span><b>${rp(p.base)}</b></div><div class="rw"><span>Paket ${PKG[d.pkg].n}</span><b>${p.pkg?rp(p.pkg):'Termasuk'}</b></div>${p.disc?`<div class="rw" style="color:var(--ok)"><span style="color:var(--ok)">Diskon FINDNUE10</span><b>−${rp(p.disc)}</b></div>`:''}<div class="rw"><span>PPN 11%</span><b>${rp(p.tax)}</b></div><div style="height:1px;background:linear-gradient(90deg,var(--gold),rgba(199,155,74,.15));margin:6px 0 4px"></div><div class="rw" style="align-items:baseline"><b style="font-size:15px">Total</b><b class="tot" id="tot" data-v="${first?0:p.total}">${rp(first?0:p.total)}</b></div>`;
      animNum($('#tot',prc),p.total)}
    function drawPc(){pcw.innerHTML=d.promo?`<div style="display:flex;align-items:center;justify-content:space-between"><span class="tag">${ic('tag')}${d.promo} diterapkan<button type="button" data-rm aria-label="Hapus kode promo">${ic('x')}</button></span><span class="mut" style="font-size:12px">Hemat 10%</span></div>`:`<div class="pcode"><label class="in" id="w-s-pc">${ic('tag','gold')}<input id="s-pc" placeholder="Kode promo" aria-label="Kode promo" autocomplete="off"></label><button class="go" type="button" data-go2>Pakai</button></div><p class="err" id="e-s-pc" role="alert"></p>`}
    drawP(true);drawPc();
    pcw.addEventListener('click',async e=>{if(e.target.closest('[data-rm]')){d.promo=null;drawPc();drawP();toast('Kode promo dilepas',{type:'info'});return}
      if(e.target.closest('[data-go2]')){const i=$('#s-pc',el),c=i.value.trim().toUpperCase();if(!c){setErr(el,'s-pc','Masukkan kode promo');return}const b=e.target.closest('[data-go2]');b.classList.add('load');await sleep(600);b.classList.remove('load');if(c==='FINDNUE10'){d.promo=c;drawPc();drawP();toast('Diskon 10% diterapkan',{type:'success'})}else setErr(el,'s-pc','Kode tidak ditemukan atau sudah kedaluwarsa')}});
    pcw.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='s-pc'){e.preventDefault();$('[data-go2]',pcw).click()}});
    $('#ag',el).addEventListener('change',e=>d.agree=e.target.checked);
    $('#snx',el).addEventListener('click',()=>{if(!d.agree){const w=$('#agw',el);w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');toast('Centang persetujuan untuk melanjutkan',{type:'error'});return}const p=priceOf(d);
      confirmSheet({icon:'receipt',title:'Konfirmasi pesanan',text:'Periksa kembali sebelum lanjut ke pembayaran. Jadwal ditahan selama 15 menit.',rows:[['Venue',esc(v.name)],['Tanggal',shortDate(d.date)],['Waktu',`${d.time} – ${endT(d.time,d.dur)}`],['Total',`<span style="color:var(--blue)">${rp(p.total)}</span>`]],ok:'Lanjut ke Pembayaran',cancel:'Periksa lagi',onOk:()=>nav.push('payment')})})}}};

Screens.payment=()=>{const d=S.draft,v=V(d.vid),p=priceOf(d);let iv;const end=Date.now()+15*60*1000;
  const opt=(k,icn,t,sub,x)=>`<div class="opt ${d.pay.m===k?'on':''}" data-m="${k}"><input type="radio" name="pm" id="pm-${k}" ${d.pay.m===k?'checked':''}><label class="opr" for="pm-${k}"><span class="rd"></span><span class="ot">${ic(icn)}</span><span style="flex:1"><b>${t}</b><br><span class="mut" style="font-size:12.5px">${sub}</span></span></label><div class="opx"><div>${x}</div></div></div>`;
  const chips=(arr,sel,k)=>`<div class="chips sm">${arr.map(b=>`<button class="chip ${b===sel?'on':''}" data-k="${k}" data-v="${b}" type="button">${b}</button>`).join('')}</div>`;
  return{html:`${hdr('Pembayaran')}<div class="body">${steps(3)}<div class="pad" style="padding-top:16px;padding-bottom:24px">

  ${opt('ew','wallet','E-Wallet','GoPay, OVO, DANA',`<div class="in2" id="x-ew">${chips(['GoPay','OVO','DANA'],d.pay.wallet,'wallet')}</div>`)}
  ${opt('tf','swap','Transfer Bank','Transfer manual',`<div class="in2"><p class="mut" style="font-size:12.5px;line-height:1.5">Nomor rekening tujuan ditampilkan setelah Anda menekan Bayar. Konfirmasi maksimal 1 x 24 jam.</p></div>`)}
  ${opt('cc','card','Kartu Kredit / Debit','Visa, Mastercard',`<div class="in2" style="padding-left:16px"><div class="cardf"><div class="full">${fld('c-num','Nomor kartu',{ph:'1234 5678 9012 3456',mode:'numeric',auto:'cc-number'})}</div>${fld('c-exp','Berlaku',{ph:'MM/YY',mode:'numeric',auto:'cc-exp'})}${fld('c-cvv','CVV',{ph:'123',mode:'numeric',type:'password',auto:'cc-csc'})}</div></div>`)}
  </div><p class="mut" style="margin-top:14px;font-size:12.5px;display:flex;gap:8px;align-items:center">${ic('shield','gold')}Pembayaran Anda dienkripsi dan terkonfirmasi otomatis.</p></div></div>
  <div class="dock"><button class="btn" id="pay" type="button">${ic('lock')}Bayar Sekarang</button></div>`,
  mount(el){const tm=$('#tmt',el),wrap=$('#tmr',el);
    const tick=()=>{const s=Math.max(0,Math.round((end-Date.now())/1000));tm.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;wrap.classList.toggle('warn',s<120);if(s===0){clearInterval(iv);confirmSheet({icon:'clock',title:'Waktu pembayaran habis',text:'Jadwal yang ditahan sudah dilepas. Silakan pilih tanggal dan jam lagi.',ok:'Kembali ke detail',cancel:'Ke beranda',onOk:()=>nav.popTo('detail')})}};
    iv=setInterval(tick,1000);Screens.payment._iv=iv;
    $('#pms',el).addEventListener('click',e=>{const c=e.target.closest('[data-k]');if(c){d.pay[c.dataset.k]=c.dataset.v;$$('[data-k='+c.dataset.k+']',el).forEach(x=>x.classList.toggle('on',x===c));return}
      const o=e.target.closest('[data-m]');if(!o||e.target.closest('.opx'))return;d.pay.m=o.dataset.m;$$('.opt',el).forEach(x=>{const on=x===o;x.classList.toggle('on',on);$('input',x).checked=on})});
    $('#c-num',el).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,16).replace(/(\d{4})(?=\d)/g,'$1 ')});
    $('#c-exp',el).addEventListener('input',e=>{let x=e.target.value.replace(/\D/g,'').slice(0,4);if(x.length>2)x=x.slice(0,2)+'/'+x.slice(2);e.target.value=x});
    $('#c-cvv',el).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,3)});
    $('#pay',el).addEventListener('click',()=>{const m=d.pay.m;
      if(m==='cc'){const n=$('#c-num',el).value.replace(/\s/g,''),ex=$('#c-exp',el).value,cv=$('#c-cvv',el).value;const E={'c-num':n.length<15?'Nomor kartu belum lengkap':'','c-exp':!/^(0[1-9]|1[0-2])\/\d{2}$/.test(ex)?'Format MM/YY':'','c-cvv':cv.length<3?'3 digit':''};Object.keys(E).forEach(k=>setErr(el,k,E[k]));if(Object.values(E).some(Boolean)){toast('Periksa data kartu Anda',{type:'error'});return}}
      const label=m==='va'?`Virtual Account ${d.pay.bank}`:m==='ew'?`E-Wallet ${d.pay.wallet}`:PAYM[m];
      confirmSheet({icon:'wallet',title:'Bayar sekarang?',text:'Pastikan metode dan nominal sudah sesuai. Pembayaran tidak dapat dibatalkan setelah diproses.',rows:[['Metode',label],['Venue',esc(v.name)],['Total',`<span style="color:var(--blue)">${rp(p.total)}</span>`]],ok:'Bayar '+rp(p.total),cancel:'Kembali',
        onOk:async()=>{clearInterval(iv);const b=busy('Menghubungkan ke penyedia pembayaran…');await sleep(1100);b.set('Memverifikasi pembayaran…');await sleep(1100);const bk=createBooking(label);b.end();nav.reset('confirm',{id:bk.id},'up')}})});
    $('[data-act=detailp]',el).addEventListener('click',()=>nav.popTo('summary'))},
  unmount(){clearInterval(iv)}}};
function createBooking(method){const d=S.draft,v=V(d.vid),p=priceOf(d),dt=pk(d.date);
  const b={id:'FN-'+String(dt.getFullYear()).slice(2)+pad(dt.getMonth()+1)+pad(dt.getDate())+'-'+String(10000+Math.floor(Math.random()*89999)),vid:v.id,date:d.date,time:d.time,dur:d.dur,ev:d.ev,guests:d.guests,pkg:d.pkg,name:d.name,total:p.total,status:'paid',method,created:Date.now(),notes:d.notes};
  S.bookings.unshift(b);saveB();S.notifs.unshift({id:'n'+Date.now(),t:'Booking berhasil dikonfirmasi',d:`${v.name}, ${shortDate(d.date)} pukul ${d.time}. Kode ${b.id}.`,time:'Baru saja',unread:true,go:b.id});saveN();S.draft=null;return b}

  mount(el){setTimeout(()=>{confetti($('#cb',el));toast('Pembayaran berhasil. Detail booking dikirim ke inbox Anda.',{type:'success'})},700)}}};

const tlRow=(on,t,s,bad)=>`<div class="${bad?'bad':on?'on':''}"><i>${ic(bad?'x':on?'check':'clock').replace('class="i ','class="i ')}</i><b>${t}</b><span>${s}</span></div>`;
Screens.bdetail=(p)=>{const b=B(p.id),v=V(b.vid);const days=Math.round((pk(b.date)-TODAY)/86400000);

  <div class="card sumc"><div class="rw"><span>Tanggal</span><b>${fmtDate(b.date)}</b></div><div class="rw"><span>Waktu</span><b>${b.time} – ${endT(b.time,b.dur)}</b></div><div class="rw"><span>Tipe acara</span><b>${EV[b.ev][0]}</b></div><div class="rw"><span>Jumlah tamu</span><b>${b.guests} orang</b></div><div class="rw"><span>Paket</span><b>${PKG[b.pkg].n}</b></div><div class="rw"><span>Pembayaran</span><b>${esc(b.method)}</b></div><div class="rw"><span>Total</span><b style="color:var(--blue)">${rp(b.total)}</b></div></div>

    draw();el._draw=draw}}};
A.contact=()=>{const s=sheet({title:'Hubungi venue',sub:'Tim venue biasanya membalas dalam 1 jam pada jam kerja.',html:`<div class="olist"><div class="card" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><div><p class="mut" style="font-size:12px">Telepon</p><b>(021) 555-0142</b></div><button class="cpy" data-copy="(021) 555-0142" aria-label="Salin nomor telepon" type="button">${ic('copy')}</button></div><div class="card" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center"><div><p class="mut" style="font-size:12px">Email</p><b>halo@venue-findnue.id</b></div><button class="cpy" data-copy="halo@venue-findnue.id" aria-label="Salin email" type="button">${ic('copy')}</button></div></div>`});
  s.el.addEventListener('click',async e=>{const b=e.target.closest('[data-copy]');if(!b)return;const ok=await copy(b.dataset.copy);toast(ok?'Disalin ke papan klip':`Salin manual: ${esc(b.dataset.copy)}`,{type:ok?'success':'info'})})};
A.cancelb=t=>{const b=B(t.dataset.id),days=Math.round((pk(b.date)-TODAY)/86400000),refund=days>=7?100:50;let reason='';
  const s=sheet({title:'Batalkan booking?',sub:`Dana dikembalikan ${refund}% (${rp(b.total*refund/100)}) karena acara ${days>=7?'masih 7 hari atau lebih lagi':'kurang dari 7 hari lagi'}.`,html:`<div class="sec-t" style="margin-top:2px">Alasan pembatalan</div><div class="chips" id="rs">${['Jadwal berubah','Memilih venue lain','Alasan pribadi','Lainnya'].map(r=>`<button class="chip" data-r="${r}" type="button">${r}</button>`).join('')}</div><p class="err" id="e-rs" role="alert">Pilih salah satu alasan</p>`,foot:`<button class="btn ghost" data-x="no" type="button">Tidak jadi</button><button class="btn danger" data-x="ok" type="button">Batalkan Booking</button>`});
  s.el.addEventListener('click',e=>{const c=e.target.closest('[data-r]');if(!c)return;reason=c.dataset.r;$$('[data-r]',s.el).forEach(x=>x.classList.toggle('on',x===c));$('#e-rs',s.el).classList.remove('show')});
  $('[data-x=no]',s.el).addEventListener('click',()=>s.close());
  $('[data-x=ok]',s.el).addEventListener('click',async()=>{if(!reason){const e=$('#e-rs',s.el);e.classList.add('show');return}const btn=$('[data-x=ok]',s.el);btn.classList.add('load');await sleep(800);s.close();const prev=b.status;b.status='cancel';b.refund=refund;saveB();S.notifs.unshift({id:'n'+Date.now(),t:'Booking dibatalkan',d:`${V(b.vid).name}. Dana ${refund}% diproses dalam 3 hari kerja.`,time:'Baru saja',unread:true,go:b.id});saveN();const top=nav.top();top.el._draw&&top.el._draw();
    toast('Booking dibatalkan',{type:'info',ms:5200,action:{label:'Urungkan',fn:()=>{b.status=prev;delete b.refund;S.notifs.shift();saveB();saveN();const tp=nav.top();tp.el._draw&&tp.el._draw();toast('Booking dipulihkan',{type:'success'})}}})})};

Screens.inbox=()=>({tab:true,html:`${hdr('Inbox',false,`<button class="ic" data-act="markall" aria-label="Tandai semua dibaca" type="button">${ic('check')}</button>`)}<div class="body" style="padding-top:8px"><div id="nl"></div><div style="height:100px"></div></div>`,

function demoDraft(){const d=newDraft('grand-sky');d.date=firstFree('grand-sky',9);d.time=TIMES.find(t=>t>='16:00'&&!slotFull('grand-sky',d.date,t))||'14:00';d.guests=300;d.ev='wedding';d.agree=true;return d}
const JUMPS=[['splash','Splash'],['onboarding','Onboarding'],['login','Login'],['home','Home'],['explore','Pencarian'],['filter','Filter'],['detail','Venue Detail'],['date','Tanggal & Waktu'],['form','Data Pemesan'],['summary','Ringkasan'],['payment','Pembayaran'],['confirm','Konfirmasi']];
function jump(k){sheets.slice().forEach(s=>s.close());$('#busy').classList.remove('on');
  const pre=()=>{S.loggedIn=true};
  if(k==='splash'){nav.reset('splash',{},'none');return}if(k==='onboarding'){nav.reset('onboarding',{},'none');return}if(k==='login'){S.loggedIn=false;nav.reset('login',{},'none');return}
  pre();if(k==='home'){nav.reset('home',{},'none');return}if(k==='explore'){F=F0();nav.reset('explore',{},'none');return}if(k==='filter'){F=F0();nav.reset('explore',{openFilter:1},'none');return}
  const home=['home',{}],det=['detail',{id:'grand-sky'}];
  if(k==='detail'){S.draft=null;nav.build([home,det]);return}
  S.draft=demoDraft();
  if(k==='date'){S.draft.date=null;S.draft.time=null;nav.build([home,det,['date',{}]]);return}
  if(k==='form'){nav.build([home,det,['date',{}],['form',{}]]);return}
  if(k==='summary'){nav.build([home,det,['date',{}],['form',{}],['summary',{}]]);return}
  if(k==='payment'){nav.build([home,det,['date',{}],['form',{}],['summary',{}],['payment',{}]]);return}
  if(k==='confirm'){const b=createBooking('Virtual Account BCA');nav.build([['confirm',{id:b.id}]])}}
$('#jumps').innerHTML=JUMPS.map(j=>`<button type="button" data-j="${j[0]}">${j[1]}</button>`).join('');
$('#jumps').addEventListener('click',e=>{const b=e.target.closest('[data-j]');if(b)jump(b.dataset.j)});
$('#rst').addEventListener('click',()=>{store.clear();S.favs=new Set(['grand-sky']);S.user={name:'Alya Putri',email:'alyaputri@mail.com',phone:'812 3456 7890'};S.recents=['Ballroom Jakarta','Wedding Bekasi'];S.loggedIn=false;S.draft=null;F=F0();S.city='Semua lokasi';seed();nav.reset('splash',{},'fade');toast('Data prototype dikembalikan ke awal',{type:'success'})});
nav.reset('splash',{},'none');
})();
